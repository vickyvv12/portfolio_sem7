/* Painted blossoms float outside the reading area. */
body{isolation:isolate;overflow-x:hidden}

.blossom:nth-child(4){right:-25px;top:42%;--size:170px;--turn:40deg;--duration:21s;--delay:-3s}

/* Wine-toned lighting and a restrained woven damask texture. */
body{background:radial-gradient(ellipse at 48% 45%,#81314f 0%,#70163e 38%,#540525 76%,#3d031c 100%);background-attachment:fixed}

.blossom:nth-child(7){--size:240px;right:-85px;bottom:-75px;filter:blur(5px);opacity:.58}

.blossom:nth-child(9){right:4%;top:27%}

.blossom:nth-child(5),.blossom:nth-child(8),.blossom:nth-child(9),.blossom:nth-child(12),.blossom:nth-child(13),.blossom:nth-child(14){filter:blur(1.3px);opacity:.38}
.blossom:nth-child(13){top:2%;right:27%}
.blossom:nth-child(6){filter:blur(.7px);opacity:.6}

/* A softly glazed reading area lifts the centre without flattening the edges. */
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 48% 65% at 49% 48%,rgba(139,55,89,.91) 0%,rgba(126,39,77,.8) 36%,rgba(126,39,77,.35) 65%,transparent 100%)}
.blossom-field{z-index:0}

.num{color:rgba(255,244,249,.88);margin-top:10px}
.project-link{padding:5px 0}
.blossom:nth-child(4){--size:310px;right:-125px;top:43%;opacity:.82!important}
.blossom:nth-child(2){--size:85px}
.blossom:nth-child(6){--size:155px;right:12%;bottom:-40px}
.ambient-twinkles{position:fixed;inset:130px 0 0;pointer-events:none;z-index:1;overflow:hidden}
.ambient-star{position:absolute;width:var(--size,10px);height:var(--size,10px);background:#fff7fc;clip-path:polygon(50% 0,60% 39%,100% 50%,60% 61%,50% 100%,40% 61%,0 50%,40% 39%);opacity:.15;animation:ambient-twinkle var(--time,7s) ease-in-out infinite;animation-delay:var(--delay,0s)}
@keyframes ambient-twinkle{0%,100%{opacity:.12;transform:scale(.55) rotate(0)}45%{opacity:.85;transform:scale(1.05) rotate(12deg)}65%{opacity:.25;transform:scale(.7) rotate(18deg)}}
@media(max-width:700px){.title{font-size:clamp(25px,6vw,36px)}.tag{font-size:11px;margin-top:0}.num{margin-top:5px}.project-link{padding:9px 0}.blossom:nth-child(4){display:none}.ambient-twinkles{inset:110px 0 0}}

.cover-card::before{content:"";position:absolute;inset:22px;border:1px solid #e3b69588;border-radius:2px 8px 8px 2px;pointer-events:none}.cover-card::after{content:"✧";font-size:66px;color:#e9bdba;line-height:1}.cover-name{font-family:MonteCarlo,cursive;font-size:57px;line-height:1.05}.cover-subtitle{font:12px/1.7 'DM Sans',sans-serif;letter-spacing:1px;max-width:220px}.cover-kicker{font:10px 'DM Sans',sans-serif;text-transform:uppercase;letter-spacing:3px}.cover-hint{font:12px 'DM Sans',sans-serif;color:#fff3ed}.skip-book{background:transparent;color:#fff0ed;font:12px 'DM Sans',sans-serif;text-decoration:underline;text-underline-offset:5px;padding:7px}
@keyframes book-float{50%{translate:0 -9px}}

.book-eyebrow{font:10px/1.5 'DM Sans',sans-serif;letter-spacing:2px;text-transform:uppercase;color:#714255;margin:0 0 10px}.contents-heading{font-size:44px;margin:0 0 13px;line-height:1.1}.author-signature{font-family:MonteCarlo,cursive;font-size:27px;margin:0 0 7px}.book-toc{display:flex;flex-direction:column;gap:2px;flex:1;justify-content:center}.toc-row{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;padding:8px 0;background:none;transition:opacity .2s,color .2s;color:#40172e}.toc-number{font:10px 'DM Sans',sans-serif;flex:0 0 25px}.toc-name{font:clamp(23px,2.5vw,34px)/1.05 MonteCarlo,cursive;white-space:nowrap}.toc-tag{font:9px/1.3 'DM Sans',sans-serif;color:#63364c;max-width:110px}.book-toc:has(.toc-row:hover) .toc-row:not(:hover){opacity:.78}.toc-row:hover,.toc-row.current{color:#9c2454}.toc-row.current .toc-name{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px}.toc-row[aria-disabled=true]{cursor:default}.toc-note{font:10px/1.5 'DM Sans',sans-serif;color:#714255;margin:12px 0 0;min-height:30px}
.book-toolbar{display:flex;gap:16px;align-items:center;margin-bottom:16px;position:relative;z-index:2}.book-toolbar button{background:none;padding:3px 0;font:11px 'DM Sans',sans-serif;color:#63364c}.book-toolbar .close-book{margin-left:auto;font-size:22px;line-height:1}.chapter-content{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center}.chapter-content:focus{outline:none}.chapter-content h1{font-size:58px;line-height:1.05;margin:5px 0 16px}.chapter-content h2{font-size:47px;line-height:1.1;margin:0 0 18px}.chapter-content p{font:15px/1.65 Georgia,serif;margin:0 0 16px}.chapter-content .lead{font-size:17px;line-height:1.5}.chapter-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin:0 0 18px;font:11px/1.5 'DM Sans',sans-serif}.chapter-meta dt{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:#714255}.chapter-meta dd{margin:3px 0 0}.chapter-art{height:145px;border-radius:4px;overflow:hidden;margin:4px 0 6px;flex-shrink:0}.chapter-art svg{width:100%;height:100%;display:block}.art-caption{font:9px/1.4 'DM Sans',sans-serif!important;color:#714255;margin:0 0 15px!important}.read-story{align-self:flex-start;background:#6a2042;color:#fff6ee;padding:11px 18px;border-radius:3px;font:12px 'DM Sans',sans-serif}.book-pagination{display:flex;align-items:center;justify-content:space-between;gap:15px;border-top:1px solid #b38a9a66;padding-top:12px;margin-top:17px;position:relative;z-index:2}.book-pagination button{background:none;color:#52243a;font-size:21px;width:35px;height:30px}.book-pagination button:disabled{opacity:.3;cursor:default}.page-count{font:10px 'DM Sans',sans-serif;letter-spacing:1px;color:#714255}.pull-quote{border-left:2px solid #b25a7b;padding:5px 0 5px 20px;margin:8px 0 22px;font:italic 22px/1.45 Georgia,serif;color:#76294a}.process-steps{list-style:none;padding:0;margin:0;display:grid;gap:16px}.process-steps li{font:14px/1.55 Georgia,serif}.process-steps strong{display:block;font:10px/1.8 'DM Sans',sans-serif;text-transform:uppercase;letter-spacing:1px;color:#873858}.two-scenes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0 18px}.scene-card{background:#e5d5d0;padding:18px 12px;min-height:120px;display:grid;place-items:center;text-align:center;font:12px/1.5 'DM Sans',sans-serif;color:#52243a}.scene-card strong{display:block;font:30px MonteCarlo,cursive}.page-flip{position:absolute;inset:0;z-index:5;pointer-events:none;background:linear-gradient(90deg,#d9bfb9,#fff5e8 12%,#f3e5dd 80%,#b78d93);transform-origin:left center;box-shadow:-10px 0 30px #4c253244;animation:turn-leaf .5s ease-in-out forwards;border-radius:0 14px 14px 0;backface-visibility:hidden}.page-flip.reverse{transform-origin:right center;animation-name:turn-leaf-back}@keyframes turn-leaf{0%{transform:rotateY(0) skewY(0);opacity:0}15%{opacity:.8}100%{transform:rotateY(-175deg) skewY(-2deg);opacity:0}}@keyframes turn-leaf-back{0%{transform:rotateY(0);opacity:0}15%{opacity:.8}100%{transform:rotateY(175deg) skewY(2deg);opacity:0}}

/* Physical binding: rounded spine, quiet foil and a fine fore-edge. */
.cover-card{width:min(505px,79vw);height:min(750px,82svh);min-height:390px;overflow:visible;box-shadow:inset 12px 0 16px #22081966,15px 17px 0 #48152d,20px 30px 40px #24051c66,30px 45px 85px #24051c77}

.cover-spine{position:absolute;left:-10px;top:0;bottom:0;width:28px;border-radius:12px 3px 3px 12px;background:linear-gradient(90deg,#2c0a20,#6b2544 25%,#b3677c 46%,#6f2747 65%,#420d2c);box-shadow:inset 2px 0 3px #f2b5b433,inset -4px 0 5px #24071d66;pointer-events:none;z-index:3}
.cover-spine::after{content:"";position:absolute;inset:5% 3px;background:linear-gradient(0deg,transparent 7%,#cba468 7.2%,#f0ce91 7.6%,transparent 8%,transparent 24%,#cba468 24.2%,#f0ce91 24.6%,transparent 25%,transparent 75%,#cba468 75.2%,#f0ce91 75.6%,transparent 76%,transparent 92%,#cba468 92.2%,#f0ce91 92.6%,transparent 93%);opacity:.8}
.cover-page-edge{position:absolute;inset:9px -13px -12px 12px;border-radius:0 10px 12px 0;background:repeating-linear-gradient(0deg,#f6e6c9 0 1px,#c8af91 1px 2px,#ead6b8 2px 3px);box-shadow:inset -4px 0 5px #76584244,5px 6px 0 #542139;transform:translateZ(-2px);z-index:-1;pointer-events:none}

const projects=[
{title:'Cape',category:'design',tag:'UX research & template design',date:'Sep 2025 – Jan 2026',role:'Template Designer Intern',tools:['UX research','Usability testing','Heuristic evaluation','Template design'],summary:'Making a starter template library easier to find and explore.',challenge:'Cape’s Template Builder helps clients create reusable content. My internship project investigated how its predefined library could better support demos and onboarding.',work:['Worked directly with clients and created templates tailored to their needs.','Evaluated 22 predefined templates, reviewed competitors and interviewed an internal stakeholder.','Conducted usability testing and identified that first-time users struggled to find the library.','Designed and tested a welcome screen, direct library link and clearer navigation.'],outcome:'Delivered a tested prototype and research-backed recommendations for discoverability, naming and reuse. These were proposals for future development.',art:'cape'},
{title:'Feedback Garden',category:'design',tag:'Research & interaction design',date:'Semester 7 · 2026',role:'Duo project · Research & web prototyping',tools:['Interviews & surveys','Usability testing','HTML / CSS','JavaScript / SVG'],summary:'Turning a quick response into a shared digital garden.',challenge:'How can museum visitors give quick, anonymous feedback while staying immersed in their visit?',work:['Conducted interviews, a survey and usability testing.','Iterated on the concept and design with my teammate using the findings.','Built a web prototype where four feedback choices generate distinct SVG flowers.','Created the response, confirmation and shared garden screens.'],outcome:'Produced an interactive prototype that visualises visitor responses as flowers. Testing informed changes to the flower differences and the journey.',art:'garden'},
{title:'Concorde',category:'design',tag:'Interactive storytelling',date:'Semester 7 · 2026',role:'Duo project · Research & front-end contribution',tools:['Audience research','Personas','Storytelling','Front-end development'],summary:'A journey from boarding in London to landing in New York.',challenge:'Create an interactive tribute that introduces an iconic design through an engaging visual story.',work:['Researched Concorde’s design, history and passenger experience.','Created audience personas and used a cabin crew interview to inform the guided journey.','Helped shape the experience around moments in a transatlantic flight.','Contributed to front-end development, including personalised boarding and completion screens.'],outcome:'Built a guided website connecting aircraft history with a personalised passenger experience.',art:'plane'},
{title:'Companion on the Road',category:'design',tag:'UX/UI · Partout / CBR',date:'Semester 3 · 2024',role:'Independently completed client assignment',tools:['Double Diamond','Interviews & surveys','Figma','Usability testing'],summary:'Helping young drivers prepare with more confidence.',challenge:'Partout’s brief asked for a digital proof of concept to support 16–19-year-olds preparing for their driving exam.',work:['Planned the project and defined research and interview questions.','Analysed interviews and surveys that pointed to anxiety and feeling underprepared.','Created wireframes and a Figma app prototype.','Refined the concept after user tests and client feedback, then presented recommendations.'],outcome:'Delivered an app concept and advice report grounded in learner needs. The concept was intended to support preparation; exam outcomes were not measured.',art:'road'},
{title:'Lighttown Speakers',category:'design',tag:'Web design & development',date:'Semester 2 · 2024',role:'Team project · Design, development & testing',tools:['Figma','HTML / CSS','Survey','Usability testing'],summary:'A clearer introduction to a local public-speaking club.',challenge:'Design and code a website explaining the club’s activities, meetings and membership.',work:['Created an individual Figma prototype.','Compared three prototypes through a team survey and refined the chosen design with client feedback.','Coded the landing and About Us pages in HTML and CSS.','Conducted a user test that revealed the logo’s Home action was unclear.'],outcome:'The team delivered a website and added an explicit Home button in response to testing.',art:'speakers'},
{title:'CitizenCity',category:'security',tag:'Data space security assessment',date:'Semester 6 · 2026',role:'Network isolation & traffic analysis',tools:['Network security','Traffic analysis','Risk analysis','Technical reporting'],summary:'Investigating security between data space services.',challenge:'The Inzicht Verlicht use case explored sharing public lighting data across systems. Our security work examined internal isolation and encryption.',work:['Assessed internal service communication and network isolation.','Verified plaintext authentication tokens and PostgreSQL traffic in captured communications.','Documented evidence and presented the associated risks to the project team.'],outcome:'Produced a documented assessment of observed weaknesses and their implications for internal data protection.',art:'network'},
{title:'Ransomware Response',category:'security',tag:'Endpoint detection & response',date:'Semester 6 · 2026',role:'Individual lab project',tools:['Wazuh','Sysmon','File integrity monitoring','Active Response'],summary:'Detecting file changes and stopping a simulator.',challenge:'Test how quickly a Windows endpoint can detect and respond to ransomware-like behaviour.',work:['Built a Windows 10 lab with decoy files, Sysmon and Wazuh monitoring.','Wrote an Active Response script to terminate the responsible process.','Tested the response with a custom ransomware simulator.'],outcome:'In lab tests, the simulator was stopped after modifying one to three files. This result applies to the tested setup and simulator.',art:'terminal'},
{title:'Security Monitoring',category:'security',tag:'Network & web attack detection',date:'Semester 6 · 2026',role:'Monitoring lab',tools:['pfSense','Wazuh','Zeek','Suricata'],summary:'Following simulated attacks through logs and alerts.',challenge:'Build a lab to understand how different monitoring tools capture network and web attack activity.',work:['Set up pfSense, Kali Linux and an Ubuntu DVWA server.','Used Wazuh, Zeek and Suricata to monitor the environment.','Simulated brute-force and web attack scenarios and compared the resulting logs and alerts.'],outcome:'Demonstrated two attack scenarios and investigated the evidence captured by each tool.',art:'network'},
{title:'Digital Forensics',category:'security',tag:'Smart home & IoT investigations',date:'Semester 6 · 2026',role:'Two academic investigation cases',tools:['Autopsy','Wireshark','HxD','DB Browser for SQLite'],summary:'Reconstructing activity across connected devices.',challenge:'Investigate two simulated incidents using smartphone images, smart-home artefacts and network captures.',work:['Verified evidence integrity using file hashes.','Examined application records, system logs and network traffic.','Compared timestamps, accounting for device time zones.','Documented findings, uncertainties and investigative leads in two journals.'],outcome:'Reconstructed incident activity from multiple sources while distinguishing supported findings from hypotheses.',art:'terminal'}];
function graphic(type){let inner='';let bg='#ebe7df';if(type==='garden'){bg='#e5ebdf';inner='<path d="M0 135Q90 95 230 140V160H0" fill="#b9c7ac"/>';for(let i=0;i<7;i++){let x=22+i*31,y=55+(i%3)*20;inner+=`<path d="M${x} 150V${y}" stroke="#566e47" stroke-width="2"/>`;for(let j=0;j<6;j++)inner+=`<ellipse cx="${x}" cy="${y-9}" rx="5" ry="10" fill="${['#c66a55','#e0b45e','#af9abc'][i%3]}" transform="rotate(${j*60} ${x} ${y})"/>`;inner+=`<circle cx="${x}" cy="${y}" r="4" fill="#f5dda3"/>`}}else if(type==='plane'){bg='#c8d5df';inner='<path d="M0 110H230" stroke="#fff8"/><path d="M20 90L211 55L139 87L115 127L104 94L44 100Z" fill="#faf8f1"/><text x="17" y="27" font-family="monospace" font-size="9" fill="#314759">LHR → JFK / MACH 2.00</text>'}else if(type==='terminal'){bg='#24312d';inner='<g fill="#b6c7ae" font-family="monospace" font-size="9"><text x="18" y="30">SYSTEM / INVESTIGATION</text><text x="18" y="60">› evidence verified</text><text x="18" y="80">› event correlation</text><text x="18" y="100">› reviewing timeline...</text><text x="18" y="133">▌</text></g>'}else if(type==='network'){bg='#d9dfec';inner='<g stroke="#8496b8" stroke-width="1.5"><path d="M115 78L42 35M115 78L192 38M115 78L48 126M115 78L185 125"/></g>';[[115,78],[42,35],[192,38],[48,126],[185,125]].forEach(([x,y],i)=>inner+=`<rect x="${x-13}" y="${y-11}" width="26" height="22" rx="4" fill="${i?'#f8f7f2':'#526884'}"/>`)}else if(type==='road'){bg='#e5bcb0';inner='<rect x="80" y="15" width="70" height="135" rx="11" fill="#f8f6f0"/><text x="90" y="37" font-size="7" font-family="Arial">READY TO GO?</text><circle cx="115" cy="68" r="17" fill="#879e8c"/><path d="M108 68L113 73L123 62" fill="none" stroke="white" stroke-width="2"/><rect x="89" y="97" width="52" height="7" rx="3" fill="#ddd9d0"/><rect x="89" y="112" width="52" height="18" rx="5" fill="#879e8c"/>'}else if(type==='speakers'){bg='#174f63';inner='<text x="18" y="35" fill="white" font-size="17" font-family="Arial" font-weight="bold">LIGHTTOWN</text><text x="18" y="55" fill="white" font-size="17" font-family="Arial" font-weight="bold">SPEAKERS.</text><path d="M20 80H210M20 90H170" stroke="#ffffff66"/><rect x="20" y="112" width="67" height="23" fill="#efb998"/><text x="30" y="127" font-size="9" font-family="Arial">JOIN THE CLUB</text>'}else{bg='#c7c0e4';inner='<rect x="18" y="21" width="194" height="119" rx="5" fill="#faf9f6"/><path d="M18 42H212" stroke="#ddd"/><g fill="#c7c0e4"><rect x="30" y="55" width="49" height="66" rx="3"/><rect x="90" y="55" width="49" height="66" rx="3"/><rect x="150" y="55" width="49" height="66" rx="3"/></g><text x="30" y="35" font-family="Arial" font-size="8">CAPE / TEMPLATE LIBRARY</text>'}return `<svg viewBox="0 0 230 160" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><rect width="230" height="160" fill="${bg}"/>${inner}</svg>`}
const landing=document.querySelector('.landing'),spread=document.querySelector('#book-spread'),leftPage=document.querySelector('#spread-left'),rightPage=document.querySelector('#spread-right');
const reduced=matchMedia('(prefers-reduced-motion: reduce)'),mobile=matchMedia('(max-width:900px)');
let opened=false,opening=false,openingTimer,turning=false,section='contents',selectedIndex=0,spreadIndex=0,mobileSide=0,turnTimers=[];
const art=p=>`<figure class="spread-art" role="img" aria-label="Illustration for ${p.title}">${graphic(p.art)}<figcaption>Project illustration · original screenshots to follow</figcaption></figure>`;
const eyebrow=t=>`<p class="book-eyebrow">${t}</p>`;
function projectLink(p,i){return `<button class="spread-project" data-project="${i}"><span class="spread-number">[${String(i+1).padStart(2,'0')}]</span><span><span class="spread-project-title">${p.title}</span><span class="spread-project-tag">[${p.tag}]</span></span></button>`}
function pages(){if(section==='contents')return [
`${eyebrow('A portfolio by Viktoria Valkova')}<h1>Contents</h1><div class="spread-toc">${projects.slice(0,5).map((p,i)=>projectLink(p,i)).join('')}</div>`,
`${eyebrow('Continue exploring')}<div class="spread-toc">${projects.slice(5).map((p,i)=>projectLink(p,i+5)).join('')}</div><div class="welcome-letter"><div class="portrait-petal" role="img" aria-label="Portrait placeholder: photo to be added"><span>VV</span></div><div><h2>Hello, I’m Viktoria.</h2><p>I explore digital experiences through research, design and a security mindset. These projects share what I made and learned along the way.</p><button class="text-link" data-section="about">More about me →</button></div></div>`];
if(section==='about')return [`${eyebrow('About the author')}<h1>Dear reader,</h1><div class="portrait-petal author-portrait" role="img" aria-label="Portrait placeholder: photo to be added"><span>VV</span></div><p class="author-signature">Viktoria Valkova</p>`,`${eyebrow('A little about me')}<h2>Curiosity, then making.</h2><p>I’m an HBO-ICT student at Fontys in Eindhoven. My work brings together media design, front-end development and cybersecurity.</p><p>I enjoy asking questions, making ideas tangible and learning from the people who use them. At Cape, I created templates for clients and researched ways to improve the template library.</p><p>Thank you for taking a look around.</p><p class="author-signature">Viktoria</p>`];
if(section==='contact')return [`${eyebrow('The final chapter')}<h1>Write to me</h1><div class="letter-ornament" aria-hidden="true">❧</div><p class="lead">Every new project begins with a conversation.</p>`,`${eyebrow('Correspondence')}<div class="preview-letter"><div class="letter-seal" aria-hidden="true">✧</div><p>Have a project in mind, a question, or simply want to connect?</p><p><a href="mailto:vikivalkova8@gmail.com">Write me an email →</a></p><p><a href="https://www.linkedin.com/in/viktoria-valkova-8a85b0271" target="_blank" rel="noopener noreferrer">Find me on LinkedIn ↗</a></p><p class="author-signature">With curiosity,<br>Viktoria</p></div>`];
const p=projects[selectedIndex],num=String(selectedIndex+1).padStart(2,'0');
if(spreadIndex===0)return [`${eyebrow('Chapter '+num+' · '+(p.category==='design'?'Design':'Cybersecurity'))}<h1>${p.title}</h1><dl class="chapter-meta"><div><dt>My role</dt><dd>${p.role}</dd></div><div><dt>Timeframe</dt><dd>${p.date}</dd></div><div class="meta-wide"><dt>Methods & tools</dt><dd>${p.tools.join(' · ')}</dd></div></dl><h3>The outcome</h3><p class="lead">${p.outcome}</p>`,`${art(p)}<h2>${p.summary}</h2><p>${p.challenge}</p><button class="read-story" id="read-story">Read the full story →</button>`];
if(spreadIndex===1)return [`${eyebrow(p.title+' · The challenge')}${art(p)}<blockquote class="pull-quote">${p.summary}</blockquote>`,`${eyebrow('From a question to a direction')}<h2>The process</h2><p>${p.challenge}</p><ol class="process-steps">${p.work.map((w,i)=>`<li><strong>${String(i+1).padStart(2,'0')}</strong>${w}</li>`).join('')}</ol>`];
return [`${eyebrow(p.title+' · The result')}<h2>What came out of it</h2><p class="lead">${p.outcome}</p><blockquote class="pull-quote">${p.summary}</blockquote><div class="project-neighbours"><button class="text-link" id="prev-project" ${selectedIndex===0?'disabled':''}>← Previous project</button><button class="text-link" id="next-project" ${selectedIndex===projects.length-1?'disabled':''}>Next project →</button></div><button class="text-link" data-section="contents">Back to contents</button>`,`${art(p)}${eyebrow('Methods & tools')}<h2>In practice</h2><div class="method-list">${p.tools.map(t=>`<span>${t}</span>`).join('')}</div><p>${p.work[p.work.length-1]}</p>`];}
function render(){const [l,r]=pages();leftPage.innerHTML=l;rightPage.innerHTML=r;spread.dataset.section=section;spread.classList.toggle('mobile-right',mobileSide===1);const base=section==='contents'?1:section==='chapter'?3+selectedIndex*6+spreadIndex*2:section==='about'?57:59;document.querySelector('#page-count').textContent=mobile.matches?`Page ${base+mobileSide}`:`${String(base).padStart(2,'0')} — ${String(base+1).padStart(2,'0')}`;document.querySelector('#spread-label').textContent=section==='chapter'?projects[selectedIndex].title:section==='contents'?'':section==='about'?'About the author':'Correspondence';document.querySelector('#previous-page').disabled=section==='contents'&&(!mobile.matches||mobileSide===0);document.querySelector('#next-page').disabled=section==='contact'&&(!mobile.matches||mobileSide===1);document.querySelectorAll('[data-project]').forEach(b=>b.onclick=()=>openProject(Number(b.dataset.project)));document.querySelectorAll('[data-section]').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.section===section));b.onclick=()=>navigateSection(b.dataset.section)});document.querySelector('#read-story')?.addEventListener('click',()=>{spreadIndex=1;mobileSide=0;turn()});document.querySelector('#prev-project')?.addEventListener('click',()=>openProject(selectedIndex-1));document.querySelector('#next-project')?.addEventListener('click',()=>openProject(selectedIndex+1));document.querySelector('#book-status').textContent=(section==='chapter'?projects[selectedIndex].title+', spread '+(spreadIndex+1)+' of 3':section)+', '+document.querySelector('#page-count').textContent;}
function turn(reverse=false){if(turning)return;turning=true;if(reduced.matches){render();turning=false;focusPage();return}const leaf=document.createElement('div');leaf.className='spread-turn'+(reverse?' reverse':'');spread.append(leaf);turnTimers.push(setTimeout(()=>{render();focusPage()},230));turnTimers.push(setTimeout(()=>{leaf.remove();turning=false},510))}
function focusPage(){(mobile.matches&&mobileSide===1?rightPage:leftPage).focus({preventScroll:true})}
function openProject(i){if(turning||i<0||i>=projects.length)return;selectedIndex=i;section='chapter';spreadIndex=0;mobileSide=0;turn()}
function navigateSection(s){if(turning)return;section=s;spreadIndex=0;mobileSide=0;turn()}
function forward(){if(turning)return;if(mobile.matches&&mobileSide===0){mobileSide=1;turn();return}mobileSide=0;if(section==='contents'){section='chapter';selectedIndex=0;spreadIndex=0}else if(section==='chapter'&&spreadIndex<2)spreadIndex++;else if(section==='chapter'&&selectedIndex<projects.length-1){selectedIndex++;spreadIndex=0}else if(section==='chapter')section='about';else if(section==='about')section='contact';else{mobileSide=1;return}turn()}
function back(){if(turning)return;if(mobile.matches&&mobileSide===1){mobileSide=0;turn(true);return}mobileSide=mobile.matches?1:0;if(section==='chapter'&&spreadIndex>0)spreadIndex--;else if(section==='chapter'&&selectedIndex>0){selectedIndex--;spreadIndex=2}else if(section==='chapter')section='contents';else if(section==='about'){section='chapter';selectedIndex=projects.length-1;spreadIndex=2}else if(section==='contact')section='about';else{mobileSide=0;return}turn(true)}
function completeOpen(){clearTimeout(openingTimer);landing.hidden=true;landing.style.display='none';document.querySelector('.book-app').classList.add('book-open');landing.classList.remove('opening');spread.hidden=false;spread.classList.remove('revealing');spread.classList.add('visible');opening=false;opened=true;render();focusPage()}
function openBook(skip=false){if(opened||opening){if(skip&&opening)completeOpen();return}opening=true;spread.hidden=false;if(skip||reduced.matches){completeOpen();return}landing.classList.add('opening');spread.classList.add('revealing');openingTimer=setTimeout(completeOpen,1550)}
function closeBook(){clearTimeout(openingTimer);turnTimers.forEach(clearTimeout);document.querySelectorAll('.spread-turn').forEach(e=>e.remove());turning=false;opened=false;opening=false;spread.hidden=true;spread.classList.remove('visible','revealing');landing.hidden=false;landing.style.display='';document.querySelector('.book-app').classList.remove('book-open');landing.classList.remove('opening');document.querySelector('#open-book').focus()}
document.querySelector('#open-book').onclick=()=>openBook();document.querySelector('#skip-book').onclick=()=>openBook(true);document.querySelector('#close-book').onclick=closeBook;document.querySelector('#contents-control').onclick=()=>navigateSection('contents');document.querySelector('#next-page').onclick=forward;document.querySelector('#previous-page').onclick=back;document.querySelector('.cover-card').addEventListener('animationend',e=>{if(e.animationName==='cover-open'&&opening)completeOpen()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(opened||opening)){e.preventDefault();closeBook()}else if(opened){if(e.key==='ArrowRight'){e.preventDefault();forward()}if(e.key==='ArrowLeft'){e.preventDefault();back()}}});let touch=null;spread.addEventListener('touchstart',e=>{touch={x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY}},{passive:true});spread.addEventListener('touchend',e=>{if(!touch||!mobile.matches)return;const x=e.changedTouches[0].clientX-touch.x,y=e.changedTouches[0].clientY-touch.y;if(Math.abs(x)>65&&Math.abs(x)>Math.abs(y)*1.5)x<0?forward():back();touch=null},{passive:true});mobile.addEventListener('change',()=>{mobileSide=0;render()});
const flowerField=document.querySelector('.blossom-field'),glow=document.querySelector('.cursor-rose');document.querySelectorAll('.blossom').forEach((e,i)=>e.style.setProperty('--depth',[.2,.8,.4,1,.35,.6][i%6]));let frame=0;document.addEventListener('pointermove',e=>{if(reduced.matches||e.pointerType==='touch')return;cancelAnimationFrame(frame);frame=requestAnimationFrame(()=>{flowerField.style.setProperty('--mouse-x',((e.clientX/innerWidth-.5)*20)+'px');flowerField.style.setProperty('--mouse-y',((e.clientY/innerHeight-.5)*20)+'px');glow.style.setProperty('--glow-x',e.clientX+'px');glow.style.setProperty('--glow-y',e.clientY+'px');if(!opened&&!opening){const c=document.querySelector('.cover-card');c.style.setProperty('--foil-x',(e.clientX/innerWidth*100)+'%');c.style.setProperty('--foil-y',(e.clientY/innerHeight*100)+'%');c.style.setProperty('--cover-y',(-8+(e.clientX/innerWidth-.5)*8)+'deg');c.style.setProperty('--cover-x',(-(e.clientY/innerHeight-.5)*5)+'deg')}})},{passive:true});setInterval(()=>{if(reduced.matches||document.hidden)return;const e=document.createElement('span');e.className='falling-petal';e.setAttribute('aria-hidden','true');e.style.setProperty('--petal-left',(Math.random()<.5?5:92)+'vw');document.body.append(e);e.addEventListener('animationend',()=>e.remove(),{once:true})},24000);render();
</script></body></html>
