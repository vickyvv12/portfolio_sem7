{title:'Cape',category:'design',tag:'UX research & template design',date:'Sep 2025 – Jan 2026',role:'Template Designer Intern',tools:['UX research','Usability testing','Heuristic evaluation','Template design'],summary:'Making a starter template library easier to find and explore.',challenge:'Cape’s Template Builder helps clients create reusable content. My internship project investigated how its predefined library could better support demos and onboarding.',work:['Worked directly with clients and created templates tailored to their needs.','Evaluated 22 predefined templates, reviewed competitors and interviewed an internal stakeholder.','Conducted usability testing and identified that first-time users struggled to find the library.','Designed and tested a welcome screen, direct library link and clearer navigation.'],outcome:'Delivered a tested prototype and research-backed recommendations for discoverability, naming and reuse. These were proposals for future development.',art:'cape'},
{title:'Feedback Garden',category:'design',tag:'Research & interaction design',date:'Semester 7 · 2026',role:'Duo project · Research & web prototyping',tools:['Interviews & surveys','Usability testing','HTML / CSS','JavaScript / SVG'],summary:'Turning a quick response into a shared digital garden.',challenge:'How can museum visitors give quick, anonymous feedback while staying immersed in their visit?',work:['Conducted interviews, a survey and usability testing.','Iterated on the concept and design with my teammate using the findings.','Built a web prototype where four feedback choices generate distinct SVG flowers.','Created the response, confirmation and shared garden screens.'],outcome:'Produced an interactive prototype that visualises visitor responses as flowers. Testing informed changes to the flower differences and the journey.',art:'garden'},
{title:'Concorde',category:'design',tag:'Interactive storytelling',date:'Semester 7 · 2026',role:'Duo project · Research & front-end contribution',tools:['Audience research','Personas','Storytelling','Front-end development'],summary:'A journey from boarding in London to landing in New York.',challenge:'Create an interactive tribute that introduces an iconic design through an engaging visual story.',work:['Researched Concorde’s design, history and passenger experience.','Created audience personas and used a cabin crew interview to inform the guided journey.','Helped shape the experience around moments in a transatlantic flight.','Contributed to front-end development, including personalised boarding and completion screens.'],outcome:'Built a guided website connecting aircraft history with a personalised passenger experience.',art:'plane'},
{title:'Companion on the Road',category:'design',tag:'UX/UI · Partout / CBR',date:'Semester 3 · 2024',role:'Independently completed client assignment',tools:['Double Diamond','Interviews & surveys','Figma','Usability testing'],summary:'Helping young drivers prepare with more confidence.',challenge:'Partout’s brief asked for a digital proof of concept to support 16–19-year-olds preparing for their driving exam.',work:['Planned the project and defined research and interview questions.','Analysed interviews and surveys that pointed to anxiety and feeling underprepared.','Created wireframes and a Figma app prototype.','Refined the concept after user tests and client feedback, then presented recommendations.'],outcome:'Delivered an app concept and advice report grounded in learner needs. The concept was intended to support preparation; exam outcomes were not measured.',art:'road'},
{title:'Lighttown Speakers',category:'design',tag:'Web design & development',date:'Semester 2 · 2024',role:'Team project · Design, development & testing',tools:['Figma','HTML / CSS','Survey','Usability testing'],summary:'A clearer introduction to a local public-speaking club.',challenge:'Design and code a website explaining the club’s activities, meetings and membership.',work:['Created an individual Figma prototype.','Compared three prototypes through a team survey and refined the chosen design with client feedback.','Coded the landing and About Us pages in HTML and CSS.','Conducted a user test that revealed the logo’s Home action was unclear.'],outcome:'The team delivered a website and added an explicit Home button in response to testing.',art:'speakers'},
{title:'CitizenCity',category:'security',tag:'Data space security assessment',date:'Semester 6 · 2026',role:'Network isolation & traffic analysis',tools:['Network security','Traffic analysis','Risk analysis','Technical reporting'],summary:'Investigating security between data space services.',challenge:'The Inzicht Verlicht use case explored sharing public lighting data across systems. Our security work examined internal isolation and encryption.',work:['Assessed internal service communication and network isolation.','Verified plaintext authentication tokens and PostgreSQL traffic in captured communications.','Documented evidence and presented the associated risks to the project team.'],outcome:'Produced a documented assessment of observed weaknesses and their implications for internal data protection.',art:'network'},
{title:'Ransomware Response',category:'security',tag:'Endpoint detection & response',date:'Semester 6 · 2026',role:'Individual lab project',tools:['Wazuh','Sysmon','File integrity monitoring','Active Response'],summary:'Detecting file changes and stopping a simulator.',challenge:'Test how quickly a Windows endpoint can detect and respond to ransomware-like behaviour.',work:['Built a Windows 10 lab with decoy files, Sysmon and Wazuh monitoring.','Wrote an Active Response script to terminate the responsible process.','Tested the response with a custom ransomware simulator.'],outcome:'In lab tests, the simulator was stopped after modifying one to three files. This result applies to the tested setup and simulator.',art:'terminal'},

{title:'Digital Forensics',category:'security',tag:'Smart home & IoT investigations',date:'Semester 6 · 2026',role:'Two academic investigation cases',tools:['Autopsy','Wireshark','HxD','DB Browser for SQLite'],summary:'Reconstructing activity across connected devices.',challenge:'Investigate two simulated incidents using smartphone images, smart-home artefacts and network captures.',work:['Verified evidence integrity using file hashes.','Examined application records, system logs and network traffic.','Compared timestamps, accounting for device time zones.','Documented findings, uncertainties and investigative leads in two journals.'],outcome:'Reconstructed incident activity from multiple sources while distinguishing supported findings from hypotheses.',art:'terminal'}];
function graphic(type){let inner='';let bg='#ebe7df';if(type==='garden'){bg='#e5ebdf';inner='<path d="M0 135Q90 95 230 140V160H0" fill="#b9c7ac"/>';for(let i=0;i<7;i++){let x=22+i*31,y=55+(i%3)*20;inner+=`<path d="M${x} 150V${y}" stroke="#566e47" stroke-width="2"/>`;for(let j=0;j<6;j++)inner+=`<ellipse cx="${x}" cy="${y-9}" rx="5" ry="10" fill="${['#c66a55','#e0b45e','#af9abc'][i%3]}" transform="rotate(${j*60} ${x} ${y})"/>`;inner+=`<circle cx="${x}" cy="${y}" r="4" fill="#f5dda3"/>`}}else if(type==='plane'){bg='#c8d5df';inner='<path d="M0 110H230" stroke="#fff8"/><path d="M20 90L211 55L139 87L115 127L104 94L44 100Z" fill="#faf8f1"/><text x="17" y="27" font-family="monospace" font-size="9" fill="#314759">LHR → JFK / MACH 2.00</text>'}else if(type==='terminal'){bg='#24312d';inner='<g fill="#b6c7ae" font-family="monospace" font-size="9"><text x="18" y="30">SYSTEM / INVESTIGATION</text><text x="18" y="60">› evidence verified</text><text x="18" y="80">› event correlation</text><text x="18" y="100">› reviewing timeline...</text><text x="18" y="133">▌</text></g>'}else if(type==='network'){bg='#d9dfec';inner='<g stroke="#8496b8" stroke-width="1.5"><path d="M115 78L42 35M115 78L192 38M115 78L48 126M115 78L185 125"/></g>';[[115,78],[42,35],[192,38],[48,126],[185,125]].forEach(([x,y],i)=>inner+=`<rect x="${x-13}" y="${y-11}" width="26" height="22" rx="4" fill="${i?'#f8f7f2':'#526884'}"/>`)}else if(type==='road'){bg='#e5bcb0';inner='<rect x="80" y="15" width="70" height="135" rx="11" fill="#f8f6f0"/><text x="90" y="37" font-size="7" font-family="Arial">READY TO GO?</text><circle cx="115" cy="68" r="17" fill="#879e8c"/><path d="M108 68L113 73L123 62" fill="none" stroke="white" stroke-width="2"/><rect x="89" y="97" width="52" height="7" rx="3" fill="#ddd9d0"/><rect x="89" y="112" width="52" height="18" rx="5" fill="#879e8c"/>'}else if(type==='speakers'){bg='#174f63';inner='<text x="18" y="35" fill="white" font-size="17" font-family="Arial" font-weight="bold">LIGHTTOWN</text><text x="18" y="55" fill="white" font-size="17" font-family="Arial" font-weight="bold">SPEAKERS.</text><path d="M20 80H210M20 90H170" stroke="#ffffff66"/><rect x="20" y="112" width="67" height="23" fill="#efb998"/><text x="30" y="127" font-size="9" font-family="Arial">JOIN THE CLUB</text>'}else{bg='#c7c0e4';inner='<rect x="18" y="21" width="194" height="119" rx="5" fill="#faf9f6"/><path d="M18 42H212" stroke="#ddd"/><g fill="#c7c0e4"><rect x="30" y="55" width="49" height="66" rx="3"/><rect x="90" y="55" width="49" height="66" rx="3"/><rect x="150" y="55" width="49" height="66" rx="3"/></g><text x="30" y="35" font-family="Arial" font-size="8">CAPE / TEMPLATE LIBRARY</text>'}return `<svg viewBox="0 0 230 160" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="230" height="160" fill="${bg}"/>${inner}</svg>`}
const list=document.querySelector('#projects'),modal=document.querySelector('#modal'),detail=document.querySelector('#detail');
projects.forEach((p,i)=>{const row=document.createElement('div');row.className='project';row.dataset.category=p.category;row.innerHTML=`<button class="project-link" aria-label="View ${p.title} project"><span class="num">[${String(i+1).padStart(2,'0')}]</span><span class="title">${p.title}</span><span class="tag">[${p.tag}]</span></button><div class="preview">${graphic(p.art)}</div>`;row.querySelector('button').onclick=()=>{detail.innerHTML=`<p class="eyebrow">${p.category==='design'?'Design':'Cybersecurity'} / ${p.date}</p><h1 id="detail-title">${p.title}</h1><p>${p.summary}</p><div class="detail-art">${graphic(p.art)}</div><p class="caption">Illustrative project graphic · Original project screenshots to be added</p><div class="detail-grid"><aside><h2>My role</h2><p>${p.role}</p><h2>Methods & tools</h2><div class="chips">${p.tools.map(t=>`<span>${t}</span>`).join('')}</div></aside><div><h2>The challenge</h2><p>${p.challenge}</p><h2>What I did</h2><ul>${p.work.map(w=>`<li>${w}</li>`).join('')}</ul><h2>The outcome</h2><p>${p.outcome}</p></div></div>`;modal.showModal();modal.scrollTop=0;};list.append(row)});
document.querySelector('.close').onclick=()=>modal.close();modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)modal.close()}});
function about(contact=false){document.querySelector('#about-detail').innerHTML=`<p class="eyebrow">${contact?'Let’s connect':'A little about me'}</p><h1 id="about-title">Hi, I’m Viktoria.</h1><div class="about-copy"><p>I’m a fourth-year HBO-ICT student at Fontys University of Applied Sciences in Eindhoven, with experience in media design and cybersecurity.</p><p>I enjoy turning research into practical digital experiences: asking questions, testing ideas and refining what I build. My work spans UX research, interaction design, front-end prototypes and security investigations.</p><h2>Experience</h2><p>Template Designer Intern at Cape · September 2025–January 2026<br>Client template creation, usability research and library prototyping.</p><p class="meta"><a href="mailto:vikivalkova8@gmail.com">Email</a> · <a href="https://www.linkedin.com/in/viktoria-valkova-8a85b0271" target="_blank" rel="noopener noreferrer">LinkedIn</a></p></div>`;openAbout()}document.querySelector('#about').onclick=()=>about();document.querySelector('#contact').onclick=openContact;

const contactScreen=document.querySelector('#contact-screen');
function openContact(){document.querySelector('#contact-note').textContent='';contactScreen.showModal();contactScreen.focus({preventScroll:true})}
document.querySelector('.contact-close').onclick=()=>contactScreen.close();

const aboutPanel=document.querySelector('#about-panel'),aboutShade=document.querySelector('#about-shade');
function openAbout(){aboutShade.hidden=false;aboutPanel.inert=false;aboutPanel.setAttribute('aria-hidden','false');aboutPanel.classList.add('is-open');aboutPanel.scrollTop=0;aboutPanel.focus({preventScroll:true});document.body.style.overflow='hidden'}
function closeAbout(){aboutPanel.classList.remove('is-open');aboutPanel.setAttribute('aria-hidden','true');aboutPanel.inert=true;aboutShade.hidden=true;document.body.style.overflow='';document.querySelector('#about').focus({preventScroll:true})}
document.querySelector('.about-close').onclick=closeAbout;aboutShade.onclick=closeAbout;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&aboutPanel.classList.contains('is-open'))closeAbout()});

const flowerField=document.querySelector('.blossom-field');
const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
let flowerFrame=0;
document.addEventListener('pointermove',event=>{
if(reduceMotion.matches||event.pointerType==='touch')return;
cancelAnimationFrame(flowerFrame);
flowerFrame=requestAnimationFrame(()=>{
flowerField.style.setProperty('--mouse-x',((event.clientX/window.innerWidth-.5)*30)+'px');
flowerField.style.setProperty('--mouse-y',((event.clientY/window.innerHeight-.5)*30)+'px');
});
},{passive:true});


document.querySelectorAll('.blossom').forEach((flower,i)=>{
flower.style.setProperty('--depth',[.22,.8,.45,1,.35,.65,.9,.5,.3,.75,.55,.4,.25,.7][i%14]);
});
const sparkleLayer=document.createElement('div');sparkleLayer.className='sparkle-layer';sparkleLayer.setAttribute('aria-hidden','true');document.body.append(sparkleLayer);
let lastSparkle=0;
document.addEventListener('pointermove',event=>{
if(reduceMotion.matches||event.pointerType==='touch'||performance.now()-lastSparkle<55)return;
lastSparkle=performance.now();
const star=document.createElement('span');star.className='cursor-sparkle';
star.style.left=(event.clientX+(Math.random()-.5)*12)+'px';star.style.top=(event.clientY+(Math.random()-.5)*12)+'px';
star.style.setProperty('--spark-size',(5+Math.random()*7)+'px');
sparkleLayer.append(star);star.addEventListener('animationend',()=>star.remove(),{once:true});
},{passive:true});
</script></body></html>
